<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sleeper Draft Monitor</title>
  </head>

  <style>
    body {
      font-family: Arial, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
    }

    h1 {
      font-size: 18px;
      margin-top: 0;
    }

    #status {
      color: #666;
      margin-bottom: 12px;
    }

    .pick {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }

    .pick-number {
      font-weight: bold;
    }

    .player-id {
      color: #666;
      font-size: 12px;
    }
  </style>

  <body>
    <h1>Sleeper Draft Picks</h1>

    <div id="status">Waiting for draft information...</div>
    <div id="picks"></div>

    <script src="popup.js"></script>
  </body>
</html>
